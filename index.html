<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mo Endemik | Conservation of Mauritius Flora</title>

  <meta
    name="description"
    content="Mo Endemik is dedicated to the conservation of native and endemic flora and the preservation of Mauritius’ botanical heritage."
  >

  <style>
    :root {
      --black: #171717;

      /* Dark green-grey for the main title */
      --title-green: #29443A;
      --title-green-dark: #20362E;

      --red: #B83A3A;
      --red-dark: #9E3030;

      --background: #fafafa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      font-family:
        "Trebuchet MS",
        Arial,
        Helvetica,
        sans-serif;

      color: var(--black);
      line-height: 1.6;

      background-color: var(--background);
    }


    /* =========================
       HEADER
    ========================= */

    header {
      height: 82px;
      padding: 0 6%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: transparent;
      border: none;

      flex-shrink: 0;
    }


    /* =========================
       WEBSITE TITLE
    ========================= */

    .logo {
      display: flex;
      align-items: center;
    }

    .logo a {
      display: inline-flex;
      align-items: center;

      color: var(--black);
      background: transparent;

      text-decoration: none;

      font-size: 0.92rem;
      font-weight: 600;

      letter-spacing: 0.06em;
      text-transform: uppercase;
    }


    /* =========================
       NAVIGATION
    ========================= */

    nav {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 7px 13px;

      color: var(--black);
      background: transparent;

      border: none;
      border-radius: 0;

      text-decoration: none;

      font-size: 0.82rem;
      font-weight: 500;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    nav a:hover {
      color: var(--title-green-dark);
      transform: translateY(-1px);
    }


    /* =========================
       DONATE BUTTON
    ========================= */

    nav a.donate-link {
      color: #ffffff;
      background: var(--red);

      border-radius: 8px;

      font-weight: 600;
    }

    nav a.donate-link:hover {
      color: #ffffff;
      background: var(--red-dark);
    }


    /* =========================
       MAIN
    ========================= */

    main {
      flex: 1;
      width: 100%;
    }


    /* =========================
       HERO
    ========================= */

    .intro {
      max-width: 1120px;
      margin: 0 auto;

      padding: 65px 6% 90px;

      text-align: center;
    }

    .hero-copy {
      margin: 0 auto;
      text-align: center;
    }

    .hero-copy h1 {
      color: var(--title-green);

      font-size: clamp(2.3rem, 4.2vw, 3.8rem);
      line-height: 1;

      font-weight: 500;
      letter-spacing: -0.045em;
    }

    .hero-copy p {
      margin: 20px auto 0;

      color: var(--black);

      font-size: 0.92rem;
      line-height: 1.6;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      width: 100%;

      flex-shrink: 0;

      padding: 25px 6%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: transparent;
      border: none;

      color: var(--black);

      font-size: 0.72rem;
    }

    footer a {
      color: var(--black);
      text-decoration: none;

      transition: color 0.2s ease;
    }

    footer a:hover {
      color: var(--title-green);
      text-decoration: underline;
    }


    /* =========================
       TABLET
    ========================= */

    @media (max-width: 850px) {

      header {
        height: 76px;
      }

      .intro {
        padding-top: 55px;
        padding-bottom: 75px;
      }
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        height: auto;
        min-height: 72px;

        padding: 14px 5%;

        gap: 10px;
      }

      .logo a {
        font-size: 0.76rem;
      }

      nav {
        gap: 5px;
      }

      nav a {
        padding: 6px 9px;
        font-size: 0.72rem;
      }

      nav a.donate-link {
        border-radius: 7px;
      }

      .intro {
        padding: 45px 5% 65px;
      }

      .hero-copy h1 {
        font-size: clamp(2.2rem, 10vw, 3.2rem);
      }

      .hero-copy p {
        max-width: 340px;

        margin-top: 19px;

        font-size: 0.85rem;
      }

      footer {
        padding: 22px 5%;

        flex-direction: column;
        align-items: flex-start;

        gap: 7px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      <a href="index.html">Mo Endemik</a>
    </div>

    <nav>
      <a href="explore.html">Explore</a>
      <a href="about.html">About</a>
      <a href="https://moendemik.mu">Nursery</a>
      <a href="donate.html" class="donate-link">Donate</a>
    </nav>

  </header>


  <main>

    <section class="intro">

      <div class="hero-copy">

        <h1>Mauritius Unique Flora</h1>

        <p>
          Preserving botanical heritage for future generations.
        </p>

      </div>

    </section>

  </main>


  <footer>

    <span>
      Conservation &amp; Propagation © Mo Endemik 2025-2026
    </span>

    <a href="terms-of-use.html">
      Terms of Use
    </a>

  </footer>

</body>
</html>
